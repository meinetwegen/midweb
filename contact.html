<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phan-Site Request | Phantom Thieves</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&family=Kanit:ital,wght@1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<header>
  <nav class="navbar navbar-expand-md site-nav" aria-label="Main">
    <div class="container">
      <a class="navbar-brand" href="index.html">Phantom Thieves</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="team.html">Team</a></li><li class="nav-item"><a class="nav-link" href="heists.html">Details</a></li><li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Contact</a></li><li class="nav-item"><button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to school life theme">School life</button></li></ul>
      </div>
    </div>
  </nav>
</header>
<main>
  <section class="page-title">
    <div class="container">
      <h1>PHAN-SITE TARGET SUBMISSION</h1>
      <p class="lead">Is there a corrupt adult whose heart needs stealing?</p>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="success-box calling-card" id="contact-success" role="status" hidden></div>
          <form class="form-box" id="contact-form" novalidate>
            <fieldset>
              <legend class="section-heading">REQUEST A CHANGE OF HEART</legend>
              <div class="mb-3">
                <label class="form-label p5-label" for="name">Target Name / Alias</label>
                <input class="form-control p5-input" type="text" id="name" name="name" placeholder="e.g. Suguru Kamoshida, Junya Kaneshiro" aria-describedby="name-error">
                <div class="invalid-feedback" id="name-error"></div>
              </div>
              <div class="mb-3">
                <label class="form-label p5-label" for="email">Informant Email Address</label>
                <input class="form-control p5-input" type="email" id="email" name="email" placeholder="joker@metaverse.jp" autocomplete="email" aria-describedby="email-error">
                <div class="invalid-feedback" id="email-error"></div>
              </div>
              <div class="mb-3">
                <label class="form-label p5-label" for="phone">Informant Phone (optional)</label>
                <input class="form-control p5-input" type="tel" id="phone" name="phone" placeholder="+7 701 123 4567" autocomplete="tel" aria-describedby="phone-error">
                <div class="invalid-feedback" id="phone-error"></div>
              </div>
              <div class="row">
                <div class="col-12 col-sm-6 mb-3">
                  <label class="form-label p5-label" for="age">Target Age</label>
                  <input class="form-control p5-input" type="number" id="age" name="age" min="1" max="99" placeholder="42" aria-describedby="age-error">
                  <div class="invalid-feedback" id="age-error"></div>
                </div>
                <div class="col-12 col-sm-6 mb-3">
                  <label class="form-label p5-label" for="date">Incident Date</label>
                  <input class="form-control p5-input" type="date" id="date" name="date" aria-describedby="date-error">
                  <div class="invalid-feedback" id="date-error"></div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label p5-label" for="color">Palace Aura Color</label>
                <input class="form-control form-control-color p5-color-input" type="color" id="color" name="color" value="#e60012">
              </div>
              <fieldset class="mb-3 radio-set">
                <legend class="p5-label">Target's Primary Crime</legend>
                <div class="p5-radio-group">
                  <input type="radio" id="o1" name="opt" value="Abuse" checked>
                  <label for="o1" class="me-3">Abuse</label>
                  <input type="radio" id="o2" name="opt" value="Theft">
                  <label for="o2" class="me-3">Theft</label>
                  <input type="radio" id="o3" name="opt" value="Extortion">
                  <label for="o3">Extortion</label>
                </div>
              </fieldset>
              <div class="mb-3">
                <label class="form-label p5-label" for="msg">Evidence &amp; Details</label>
                <textarea class="form-control p5-input" id="msg" name="msg" rows="4" maxlength="200" placeholder="Describe their corrupt actions and the harm caused..." aria-describedby="msg-error msg-count"></textarea>
                <div class="invalid-feedback" id="msg-error"></div>
                <p class="char-count mb-0" id="msg-count">0 / 200</p>
              </div>
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="agree" name="agree" aria-describedby="agree-error">
                <label class="form-check-label p5-check-label" for="agree">I swear this report is true and I accept the risk of calling the Phantom Thieves.</label>
                <div class="invalid-feedback" id="agree-error"></div>
              </div>
              <button type="submit" class="btn btn-p5">SUBMIT TARGET INTEL</button>
            </fieldset>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>
<footer class="site-footer"><div class="container footer-row"><p class="mb-0">Phantom Thieves fan site, 2026</p><p class="mb-0">Made by Alexandra and Zhannel</p></div></footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/validation.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
